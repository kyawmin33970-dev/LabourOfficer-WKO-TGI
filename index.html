<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labour Officer WKO Taunggyi</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Pyidaungsu', 'Myanmar Text', sans-serif;
    background: #eef2f7;
    margin: 0;
    padding: 12px;
    color: #222;
  }
  .wrap {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    padding: 22px;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
  }
  .hide { display: none; }
  h2 { text-align: center; color: #1565c0; margin: 4px 0 2px; font-size: 20px; }
  h3 { text-align: center; color: #555; font-weight: normal; font-size: 15px; margin: 0 0 14px; }
  .sub { text-align: center; color: #777; font-size: 13px; margin-bottom: 18px; }
  .sec {
    background: #1565c0;
    color: #fff;
    padding: 8px 12px;
    margin: 22px 0 12px;
    border-radius: 5px;
    font-size: 15px;
  }
  .fg { margin-bottom: 14px; }
  label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }
  input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #c7cdd6;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #1565c0;
    box-shadow: 0 0 0 2px #d7e5f7;
  }
  .err { color: #c62828; font-size: 12px; margin-top: 4px; min-height: 14px; }
  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-save { background: #2e7d32; color: #fff; margin-top: 22px; }
  .btn-save:hover { background: #256428; }
  .btn-ghost {
    background: #fff;
    color: #1565c0;
    border: 1px solid #1565c0;
    margin-top: 10px;
    font-size: 14px;
  }
  .btn-ghost:hover { background: #eaf2fb; }
  .btn-danger {
    background: #c62828;
    color: #fff;
    margin-top: 10px;
    font-size: 14px;
  }
  .btn-danger:hover { background: #a01d1d; }
  .prev {
    max-width: 120px;
    max-height: 120px;
    margin-top: 8px;
    border: 1px solid #ddd;
    border-radius: 5px;
    display: block;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #666;
    margin-bottom: 6px;
  }
  .logout {
    background: #c62828;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .record {
    background: #f6f8fa;
    border-left: 3px solid #1565c0;
    padding: 10px 12px;
    border-radius: 5px;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 8px;
  }
  .record b { color: #1565c0; }
  .record small { color: #888; }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen" class="wrap">
  <h2>Labour Officer WKO Taunggyi</h2>
  <p class="sub">လေ့ကျင့်ရေး သင်ထောက်ကူ</p>

  <div class="fg">
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="wkotaunggyi2026@gmail.com">
  </div>
  <div class="fg">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="စကားဝှက်">
  </div>
  <div id="loginError" class="err"></div>
  <button class="btn btn-save" onclick="doLogin()">အကောင့်ဝင်မည်</button>
  <button class="btn btn-ghost" onclick="fillDemo()">Demo ဖြည့်ရန်</button>
</div>

<!-- ===== APP ===== -->
<div id="appScreen" class="wrap hide">
  <div class="topbar">
    <span>WKO Taunggyi</span>
    <button class="logout" onclick="doLogout()">ထွက်မည်</button>
  </div>

  <h2>Labour Officer WKO Taunggyi</h2>
  <h3>အလုပ်သမားကတ် လျှောက်လွှာ (လေ့ကျင့်ရန်)</h3>

  <form id="laborForm" onsubmit="saveData(event)">

    <div class="sec">ကိုယ်ရေးအချက်အလက်</div>

    <div class="fg">
      <label>* အမည်</label>
      <input type="text" id="name" required placeholder="ဥပမာ - မောင်ဖြူ">
    </div>
    <div class="fg">
      <label>* မွေးသက္ကရာဇ်</label>
      <input type="date" id="dob" required>
    </div>
    <div class="fg">
      <label>* အဘ အမည်</label>
      <input type="text" id="fatherName" required placeholder="ဥပမာ - ဦးအောင်">
    </div>
    <div class="fg">
      <label>* ကျား / မ</label>
      <select id="gender">
        <option value="မ">မ</option>
        <option value="ကျား">ကျား</option>
      </select>
    </div>
    <div class="fg">
      <label>* နိုင်ငံသားစိစစ်ရေးအမှတ်</label>
      <input type="text" id="nrc" required placeholder="ဥပမာ - ၁၂/ဥကမ(နိုင်)၁၂၂၉၈၈">
    </div>

    <div class="sec">ဓာတ်ပုံနှင့် အထောက်အထား</div>

    <div class="fg">
      <label>* မိမိဓာတ်ပုံ</label>
      <input type="file" id="photo" accept="image/*" onchange="showPreview(event,'photoPreview')">
      <img id="photoPreview" class="prev" alt="">
    </div>
    <div class="fg">
      <label>ဘွဲ့လက်မှတ် / အထောက်အထားပုံ</label>
      <input type="file" id="signature" accept="image/*" onchange="showPreview(event,'sigPreview')">
      <img id="sigPreview" class="prev" alt="">
    </div>

    <div class="sec">ဆက်သွယ်ရန်လိပ်စာ</div>

    <div class="fg">
      <label>* အိမ်အမှတ်</label>
      <input type="text" id="houseNo" required placeholder="ဥပမာ - ၁၂၃">
    </div>
    <div class="fg">
      <label>* လမ်းအမည်</label>
      <input type="text" id="street" required placeholder="ဥပမာ - ဝါးပြားလမ်း">
    </div>
    <div class="fg">
      <label>* တိုင်းဒေသကြီး / ပြည်နယ်</label>
      <select id="state">
        <option>ရှမ်းပြည်နယ်</option>
        <option>ရန်ကုန်တိုင်းဒေသကြီး</option>
        <option>မန္တလေးတိုင်းဒေသကြီး</option>
        <option>ကချင်ပြည်နယ်</option>
        <option>ကယားပြည်နယ်</option>
      </select>
    </div>
    <div class="fg">
      <label>* မြို့နယ်</label>
      <input type="text" id="township" required placeholder="ဥပမာ - တောင်ကြီးမြို့နယ်">
    </div>
    <div class="fg">
      <label>* ဖုန်းနံပါတ် (09 နဲ့စပြီး ၁၁ လုံး)</label>
      <input type="tel" id="phone" maxlength="11" required oninput="checkPhone(this)" placeholder="၀၉၁၂၃၄၅၆၇၈၉">
      <div id="phoneError" class="err"></div>
    </div>

    <div class="sec">ပညာအရည်အချင်း</div>

    <div class="fg">
      <label>* ကျောင်းအမည်</label>
      <input type="text" id="schoolName" required placeholder="ဥပမာ - အထက (က) တောင်ကြီး">
    </div>
    <div class="fg">
      <label>* အတန်း / ဘွဲ့အမျိုးအစား</label>
      <input type="text" id="educationLevel" required placeholder="ဥပမာ - ၁၂ တန်း / BA History">
    </div>

    <button type="submit" class="btn btn-save">သိမ်းဆည်းမည်</button>
    <button type="button" class="btn btn-ghost" onclick="clearForm()">ဖောင် ပြန်ရှင်းမည်</button>
  </form>

  <div id="savedBox" class="hide">
    <div class="sec" style="background:#2e7d32; margin-top:28px;">သိမ်းထားတဲ့ စာရင်း</div>
    <div id="records"></div>
    <button class="btn btn-danger" onclick="wipeAll()">အားလုံး ဖျက်မည်</button>
  </div>
</div>

<script>
  const EMAIL = 'wkotaunggyi2026@gmail.com';
  const PASS  = '91202626';

  window.onload = function () {
    if (sessionStorage.getItem('wko_login') === 'yes') {
      openApp();
    }
    renderRecords();
  };

  function fillDemo() {
    document.getElementById('loginEmail').value = EMAIL;
    document.getElementById('loginPassword').value = PASS;
  }

  function doLogin() {
    const e = document.getElementById('loginEmail').value.trim();
    const p = document.getElementById('loginPassword').value.trim();
    const box = document.getElementById('loginError');

    if (e === EMAIL && p === PASS) {
      sessionStorage.setItem('wko_login', 'yes');
      openApp();
    } else {
      box.innerText = 'Email ဒါမှမဟုတ် Password မှားနေတယ်။';
    }
  }

  function openApp() {
    document.getElementById('loginScreen').classList.add('hide');
    document.getElementById('appScreen').classList.remove('hide');
    renderRecords();
  }

  function doLogout() {
    if (!confirm('ထွက်မှာ သေချာလား?')) return;
    sessionStorage.removeItem('wko_login');
    location.reload();
  }

  function checkPhone(el) {
    el.value = el.value.replace(/[^0-9]/g, '');
    const err = document.getElementById('phoneError');
    const v = el.value;
    if (v.length && (v.slice(0,2) !== '09' || v.length !== 11)) {
      err.innerText = '09 နဲ့စပြီး ၁၁ လုံး ဖြစ်ရမယ်။';
    } else {
      err.innerText = '';
    }
  }

  function showPreview(ev, id) {
    const f = ev.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = e => document.getElementById(id).src = e.target.result;
    r.readAsDataURL(f);
  }

  function saveData(ev) {
    ev.preventDefault();
    const ph = document.getElementById('phone').value;
    if (ph.slice(0,2) !== '09' || ph.length !== 11) {
      alert('ဖုန်းနံပါတ် မမှန်ဘူး။ 09 နဲ့စပြီး ၁၁ လုံး ဖြစ်ရမယ်။');
      return;
    }

    const rec = {
      id: Date.now(),
      name: document.getElementById('name').value,
      dob: document.getElementById('dob').value,
      father: document.getElementById('fatherName').value,
      gender: document.getElementById('gender').value,
      nrc: document.getElementById('nrc').value,
      houseNo: document.getElementById('houseNo').value,
      street: document.getElementById('street').value,
      state: document.getElementById('state').value,
      township: document.getElementById('township').value,
      phone: ph,
      school: document.getElementById('schoolName').value,
      level: document.getElementById('educationLevel').value,
      at: new Date().toLocaleString('my-MM')
    };

    const list = JSON.parse(localStorage.getItem('wko_data') || '[]');
    list.push(rec);
    localStorage.setItem('wko_data', JSON.stringify(list));

    alert('သိမ်းပြီးပါပြီ။');
    clearForm();
    renderRecords();
  }

  function clearForm() {
    document.getElementById('laborForm').reset();
    document.getElementById('photoPreview').src = '';
    document.getElementById('sigPreview').src = '';
    document.getElementById('phoneError').innerText = '';
  }

  function renderRecords() {
    const list = JSON.parse(localStorage.getItem('wko_data') || '[]');
    const box = document.getElementById('savedBox');
    const out = document.getElementById('records');

    if (!list.length) {
      box.classList.add('hide');
      return;
    }
    box.classList.remove('hide');

    out.innerHTML = list.map((r, i) => `
      <div class="record">
        <b>${i+1}. ${r.name || '(အမည်မဖြည့်)'}</b><br>
        မွေး - ${r.dob || '-'} | ${r.gender}<br>
        NRC - ${r.nrc || '-'}<br>
        ဖုန်း - ${r.phone}<br>
        လိပ်စာ - ${r.houseNo}, ${r.street}, ${r.township}, ${r.state}<br>
        ပညာ - ${r.school} (${r.level})<br>
        <small>${r.at}</small>
      </div>
    `).join('');
  }

  function wipeAll() {
    if (!confirm('အားလုံး ဖျက်မှာ သေချာလား?')) return;
    localStorage.removeItem('wko_data');
    renderRecords();
  }
</script>
</body>
</html>
